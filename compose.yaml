services:
  streamlit:
    image: forecast-app:local
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501

  api:
    image: forecast-app:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import requests, sys; r = requests.get('http://127.0.0.1:8000/health'); sys.exit(0 if r.status_code == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 5

    
  
  migrate:
    build: .
    image: forecast-app:local
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head


  migrate_dev:
    image: forecast-app:local
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy



  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  
  tests:
    profiles:
      - test
    image: forecast-app:local
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m pytest


volumes:
  postgres_data:


    